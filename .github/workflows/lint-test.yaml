name: lint-test

# CI for this repo's own reusable workflows and helper scripts.
#
# An explicit file list rather than the whole .github/workflows/ directory:
# sync-issue-templates.yaml still carries a pre-existing floating, EOL
# actions/checkout@v3 pin that is out of scope here. Add it below once that
# is cleaned up.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run actionlint
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color \
            .github/workflows/pack-build-image.yaml \
            .github/workflows/pack-release.yaml \
            .github/workflows/lint-test.yaml \
            .github/workflows/sign-smoke.yaml \
            .github/workflows/sync-project-priority.yaml

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install "ruamel.yaml==0.19.1" pytest

      - name: Run pytest
        run: |
          set -euo pipefail
          python3 -m pytest .github/scripts/
