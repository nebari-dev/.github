name: pack-build-image

on:
  workflow_call:
    inputs:
      image:
        description: "Image name suffix, e.g. 'operator' or 'frontend'."
        required: true
        type: string
      context:
        description: "Docker build context path."
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile. Defaults to '<context>/Dockerfile'."
        required: false
        type: string
        default: ""
      target:
        description: "Optional multi-stage build target."
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma-separated platforms to build for."
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Whether to push the built image. Set false for pull_request builds."
        required: false
        type: boolean
        default: true
      scan:
        description: "Scan the built image (linux/amd64) for fixable CRITICAL/HIGH CVEs."
        required: false
        type: boolean
        default: false
      scan-baseline-workflow:
        description: >-
          Workflow file name (e.g. 'scan-images.yaml') of the calling repo's
          scheduled pack-scan-images run. When set, a scan on a push: false
          build fails only on findings not in this image's baseline from that
          workflow's latest scheduled run on main; a missing baseline makes
          every finding block. Empty (the default): every finding blocks.
        required: false
        type: string
        default: ""
    secrets:
      QUAY_TOKEN:
        required: false
      QUAY_USERNAME:
        required: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ inputs.image }}
  QUAY_IMAGE: quay.io/nebari/${{ github.event.repository.name }}-${{ inputs.image }}

jobs:
  build:
    name: Build and push ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Quay
        if: ${{ inputs.push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.QUAY_IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:cache
          cache-to: ${{ inputs.push && format('type=registry,ref={0}:cache,mode=max', env.GHCR_IMAGE) || '' }}

      # Export a linux/amd64 build of the same context, Dockerfile and target
      # as an OCI layout directory for the scan. Only amd64 is scanned,
      # whatever `platforms` is. Layers come from the build above through the
      # same builder and cache. provenance and sbom are off so the layout
      # holds the image and no attestation manifest. Written to
      # $RUNNER_TEMP, and before the _dot-github checkout, so neither lands
      # inside a build context. On a push build an export failure must not
      # stop the job before signing: the Scan step then finds no layout and
      # reports an error as a warning.
      - name: Export for scan (linux/amd64)
        if: ${{ inputs.scan }}
        continue-on-error: ${{ inputs.push }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          target: ${{ inputs.target }}
          platforms: linux/amd64
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/scan-oci
          provenance: false
          sbom: false
          push: false
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:cache

      # Reusable workflows resolve `uses: ./` against the CALLER's workspace,
      # not this repo, so the composite sign and trivy-scan actions must be
      # loaded from a checkout of THIS repo. job.workflow_repository@
      # job.workflow_sha pins exactly the nebari-dev/.github commit the caller
      # invoked, keeping the action version coherent with the workflow
      # version. (Same pattern as pack-release.yaml's _dot-github checkout.)
      #
      # Step order is part of this workflow's contract: signing runs before
      # the scan, so a scan-tool failure cannot leave a pushed image unsigned.
      - name: Check out the reusable workflow's repo (for the sign and scan actions)
        if: ${{ inputs.push || inputs.scan }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _dot-github

      - name: Sign + attest (GHCR)
        if: ${{ inputs.push }}
        uses: ./_dot-github/.github/actions/sign-oci
        with:
          image: ${{ env.GHCR_IMAGE }}
          digest: ${{ steps.build.outputs.digest }}

      - name: Sign + attest (Quay)
        if: ${{ inputs.push }}
        uses: ./_dot-github/.github/actions/sign-oci
        with:
          image: ${{ env.QUAY_IMAGE }}
          digest: ${{ steps.build.outputs.digest }}

      # With scan-baseline-workflow set on a pull request build, fetch this
      # image's findings from the newest completed scheduled run of that
      # workflow on main that still has them (artifact
      # trivy-baseline-<slug>, written by pack-scan-images.yaml; the 10
      # newest runs are searched). The job's own token reads them: that
      # works in a public repo, and in a private one (no actions: read) the
      # lookup fails. Any failure only leaves no file, and the Scan step,
      # given a baseline path with no file behind it, blocks on every
      # finding (fail closed).
      - name: Fetch the scan baseline from main
        if: ${{ inputs.scan && !inputs.push && inputs.scan-baseline-workflow != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.scan-baseline-workflow }}
          SLUG_SCRIPT: _dot-github/.github/scripts/collect_chart_images.py
        run: |
          set -uo pipefail
          dest="$RUNNER_TEMP/scan-baseline"
          rm -rf "$dest"
          no_baseline() {
            echo "::warning::No scan baseline: $1. Every finding blocks."
            exit 0
          }
          # The slug the scheduled scan's matrix gives this image: image
          # references are lowercase, and GHCR_IMAGE is the repository with
          # no tag. --slug needs only the standard library.
          slug="$(python3 "$SLUG_SCRIPT" --slug "${GHCR_IMAGE,,}")" \
            || no_baseline "could not compute the image's slug"
          name="trivy-baseline-${slug}"
          run_ids="$(gh run list -R "$GITHUB_REPOSITORY" -w "$WORKFLOW" -b main -e schedule \
              --status completed -L 10 --json databaseId --jq '.[].databaseId')" \
            || no_baseline "could not list the scheduled runs of ${WORKFLOW} on main"
          for id in $run_ids; do
            live="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?name=${name}" \
                --jq '[.artifacts[] | select(.expired | not)] | length')" || continue
            if (( live > 0 )); then
              gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$name" -D "$dest" \
                || { rm -rf "$dest"; no_baseline "could not download ${name} from run ${id}"; }
              echo "Scan baseline: ${name} from run ${id}."
              exit 0
            fi
          done
          no_baseline "no ${name} artifact in the 10 newest completed scheduled runs of ${WORKFLOW} on main"

      # On a pull request build (push: false) findings, ignore-file lint
      # problems and Trivy execution failures fail the job; with
      # scan-baseline-workflow set, only findings the baseline lacks do. On
      # a push build they become the job summary plus a warning, and the
      # job result is unchanged.
      - name: Scan
        if: ${{ inputs.scan }}
        uses: ./_dot-github/.github/actions/trivy-scan
        with:
          input: ${{ runner.temp }}/scan-oci
          fail-on-findings: ${{ inputs.push && 'false' || 'true' }}
          baseline: ${{ (!inputs.push && inputs.scan-baseline-workflow != '') && format('{0}/scan-baseline/trivy-findings.json', runner.temp) || '' }}
          title: ${{ inputs.image }}
